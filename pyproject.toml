[project]
name = "wc-agent-connector"
version = "0.1.0"
description = "Read-only WooCommerce connector (MCP) for AI agents"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
wc-connector = "wc_connector.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wc_connector"]
